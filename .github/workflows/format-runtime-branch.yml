name: Format runtime branch

on:
  push:
    branches:
      - feature/runtime-provider-typed

permissions:
  contents: write

jobs:
  format:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/runtime-provider-typed
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Setup npm
        run: npm install --global npm@11.8.0

      - name: Install dependencies
        run: npm ci

      - name: Format TypeScript and Rust
        run: npm run format

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo 'Working tree is already formatted.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: format runtime branch [skip ci]'
          git push origin HEAD:feature/runtime-provider-typed
